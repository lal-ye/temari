# One service, no database. Test this branch before merging into main.
services:
  - type: web
    name: temari
    runtime: node
    plan: free
    branch: arena/01a09569-temari
    buildCommand: NODE_ENV=development bun install --frozen-lockfile && bun run build:render
    startCommand: node build/server.cjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
      - key: BUN_VERSION
        value: "1.3.9"
      - key: NODE_ENV
        value: production
      - key: TEMARI_HOSTED
        value: "true"
