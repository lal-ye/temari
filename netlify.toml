[build]
  command = "bun run typecheck && bun run test && bun run build:client"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.22.3"
  BUN_VERSION = "1.3.9"
  BUN_FLAGS = "--frozen-lockfile"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-parse", "@napi-rs/canvas"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
