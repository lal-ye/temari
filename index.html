<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySmart (Temari) - AI Learning & Exam Companion</title>
    <meta name="description" content="AI-powered interactive notes, flashcard quizzes, comprehensive mock exams with automated grading, and study analytics." />
    <meta property="og:title" content="StudySmart (Temari) - AI Learning Companion" />
    <meta property="og:description" content="Interactive study notes, Mermaid mindmaps, flashcard drills, mock exams, and analytics." />
    <meta property="og:type" content="website" />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Mermaid.js for interactive Mindmap diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      if (window.mermaid) {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: 'neutral',
          securityLevel: 'loose',
          mindmap: {
            padding: 16,
            useMaxWidth: true
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
