name: Android preview APK

on:
  workflow_dispatch:

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # v3's default packages list includes the `tools` package, which Google removed from
      # the SDK repository, so sdkmanager exits 1. v4 defaults to platform-tools only.
      - uses: android-actions/setup-android@v4.0.4

      # eas-cli-local-build-plugin throws if ANDROID_NDK_HOME points at a missing path, and
      # Gradle needs the NDK to compile the new-architecture codegen C++. Pin the version
      # Expo SDK 57 / RN 0.86 expects rather than trusting whatever the image happens to ship.
      - name: Set ANDROID_NDK_HOME
        run: |
          NDK_VERSION=27.1.12297006
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]; then
            sdkmanager "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "using NDK $ANDROID_NDK_HOME"

      - run: bun install --frozen-lockfile

      # --local keeps the build on the runner (14 GB free SSD, 16 GB RAM) and pulls the
      # signing keystore from Expo's remote credentials, so no keystore is stored in the repo.
      - name: Build preview APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: bunx eas-cli@latest build --platform android --profile preview --local --output preview.apk

      - uses: actions/upload-artifact@v4
        with:
          name: temari-preview-apk
          path: apps/mobile/preview.apk
          if-no-files-found: error
