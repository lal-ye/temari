# The single gate definition for the repository. The Android APK dispatcher calls
# this workflow (workflow_call) so a failed gate blocks both APK profiles instead of
# letting a broken commit reach a signed binary.
#
# `test:web` runs against the export that `check:web` produces, and its offline
# assertions depend on the service worker `build-web-offline.mjs` writes, so the web
# export must stay ordered ahead of the browser tests.
# The runner image is pinned to a release rather than tracking `ubuntu-latest`,
# which migrates to Ubuntu 26 on 2026-10-19. This workflow's whole toolchain is
# pinned (.nvmrc, .bun-version, and Playwright's own browser build), so an image
# jump underneath it would reintroduce exactly the drift the pins exist to prevent.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed by workflow name as well as ref. The Android APK dispatcher reuses this
  # workflow as its gate, and a reusable call keeps the caller's ref — so a
  # ref-only group would make the dispatched gate and the standalone push run
  # cancel each other. In a called workflow `github.workflow` is the caller's name,
  # which is exactly the distinction needed here.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Reader, tests, typechecks, Android + web exports, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run check:reader
      - run: NODE_ENV=test bun run test
      - run: bun run test:adapters
      - run: bun run typecheck:all
      - run: bun run check:mobile:imports
      - run: bun run check:mobile
      - run: bun run check:web

      # Playwright's own installer is the supported source of the browser; the
      # chromium build already checked into npm (and used in the offline sandbox)
      # would not cover the browsers CI actually claims to test. The browser tests
      # run against the export `check:web` just produced, so that ordering matters.
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - run: bun run test:web
