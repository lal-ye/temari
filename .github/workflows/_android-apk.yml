# Reusable Android APK build. Callers pass an eas.json profile and an artifact
# name; everything that affects the compiled binary lives here, so the toolchain
# pin has exactly one home instead of one per profile.
name: Reusable Android APK build

on:
  workflow_call:
    inputs:
      profile:
        description: Build profile from apps/mobile/eas.json
        required: true
        type: string
      artifact:
        description: Artifact name, also used as the .apk filename
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Gradle picks the JDK from JAVA_HOME, and ubuntu-latest's default JDK moves
      # between image revisions. Pin 17 explicitly so a runner image refresh cannot
      # turn into an AGP "Unsupported class file major version" build failure.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # v3's default packages list includes the `tools` package, which Google removed from
      # the SDK repository, so sdkmanager exits 1. v4 defaults to platform-tools only.
      - uses: android-actions/setup-android@v4.0.4

      # setup-android v4 defaults to platform-tools only, and apksigner (used below to
      # verify the built APK before it is published) ships in build-tools, not
      # platform-tools. Pin the same build-tools version the Gradle build resolves so
      # the verification tool is present and deterministic instead of being scavenged
      # from whatever the runner image happens to ship.
      - name: Install pinned Android build-tools
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION=34.0.0
          sdkmanager "build-tools;$BUILD_TOOLS_VERSION"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "using build-tools $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"

      # eas-cli-local-build-plugin throws if ANDROID_NDK_HOME points at a missing path, and
      # Gradle needs the NDK to compile the new-architecture codegen C++. Pin the version
      # Expo SDK 57 / RN 0.86 expects rather than trusting whatever the image happens to
      # ship. Installed unconditionally: Expo local builds ignore eas.json's ndk field, so
      # this file is the only place the version is recorded, and a guard that skips the
      # install when the image happens to carry the right NDK would make the build depend
      # on image contents it does not control.
      - name: Install pinned Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION=27.1.12297006
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "using NDK $ANDROID_NDK_HOME"

      - run: bun install --frozen-lockfile

      # --local keeps the build on the runner (14 GB free SSD, 16 GB RAM) and pulls the
      # signing keystore from Expo's remote credentials, so no keystore is stored in the
      # repo. It also keeps the EAS build queue and compute quota out of the picture; EAS
      # is contacted only for the project check and managed credentials. Profile and file
      # name arrive as env vars so caller input is never interpolated into the script.
      #
      # eas-cli is pinned to the same version as apps/mobile/eas.json's `cli.version`,
      # which is the version the documented manual commands use. `@latest` would let a
      # new CLI release change local-build flag handling with no repo change to review.
      - name: Build APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
          APK_PROFILE: ${{ inputs.profile }}
          APK_NAME: ${{ inputs.artifact }}
        run: bunx eas-cli@24.13.0 build --platform android --profile "$APK_PROFILE" --local --non-interactive --output "$APK_NAME.apk"

      # Publishing bytes before checking them only moves the failure to the person who
      # installs the APK. Verify the signature first, then attach provenance so the
      # recorded SHA-256 can be re-derived from the artifact the owner actually
      # downloaded.
      - name: Verify APK signature
        working-directory: apps/mobile
        env:
          APK_NAME: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "${APK_NAME}.apk"

      - name: Record checksum and build metadata
        working-directory: apps/mobile
        env:
          APK_NAME: ${{ inputs.artifact }}
          APK_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          sha256sum "${APK_NAME}.apk" > "${APK_NAME}.apk.sha256"
          {
            echo "profile=${APK_PROFILE}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "size_bytes=$(stat -c %s "${APK_NAME}.apk")"
          } > "${APK_NAME}.build-metadata.txt"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ inputs.artifact }}
          path: |
            apps/mobile/${{ inputs.artifact }}.apk
            apps/mobile/${{ inputs.artifact }}.apk.sha256
            apps/mobile/${{ inputs.artifact }}.build-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          {
            echo "### ${APK_PROFILE} APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Profile | \`${APK_PROFILE}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Artifact | [${APK_NAME}](${{ steps.upload.outputs.artifact-url }}) |"
            echo "| Retained | 14 days |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "${APK_NAME}.apk.sha256")\` |"
            echo "| Verified | apksigner \`verify\` passed before upload |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          APK_PROFILE: ${{ inputs.profile }}
          APK_NAME: ${{ inputs.artifact }}
